version: "2"

run:
  build-tags:
    - stdjson

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - fatcontext
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - wastedassign
  settings:
    gosec:
      excludes:
        - G104   # unhandled errors — covered by errcheck

  exclusions:
    paths:
      - internal/captcha/assets
    rules:
      # defer Close() — cleanup, error intentionally ignored
      - linters:
          - errcheck
        text: "`.*\\.Close` is not checked"
      # Tests: relaxed rules
      - path: _test\.go
        linters:
          - errcheck
          - unconvert
          - unused
          - gosec
          - noctx
