name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Часовой дозор базовых образов (base-update.yml) дёргает пересборку прод-образа
  # без пуша кода, когда базовые образы из Dockerfile (golang:X.Y-alpine,
  # alpine:Z.W) обновились на Docker Hub.
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild production image from current main without a code push
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gotag
        # Тулчейн тестов = тулчейн прод-образа: читаем версию прямо из
        # Dockerfile, чтобы dependabot-бамп базы не рассинхронизировал их
        # (хардкод '1.26' пережил бамп Dockerfile на 1.27 и тихо нарушил
        # этот инвариант).
        run: echo "go=$(awk '/^FROM golang/{tag=$2; gsub(/-alpine$/, "", tag); sub(/^golang:/, "", tag); print tag; exit}' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ steps.gotag.outputs.go }}'
          cache: true
      - name: Check Alpine version probe with Docker
        run: |
          ALPINE=$(awk '/^FROM alpine/{print $2; exit}' Dockerfile)
          printf '%s\n' "FROM $ALPINE" 'USER 10001' 'VOLUME ["/data"]' | docker build -t antispam-alpine-probe -
          source scripts/deploy-notify.sh
          version=$(alpine_version antispam-alpine-probe)
          test "$version" != неизвестна
          echo "Alpine version probe succeeded: $version"
      - run: go mod download
      - run: test -z "$(gofmt -l .)" || { echo 'gofmt required:'; gofmt -l .; exit 1; }
      - run: go vet -tags stdjson ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags stdjson ./...
      - run: go test -race -tags stdjson -count=1 ./...
      - run: go build -tags stdjson ./...

  # Прод-образ: собирается ТОЛЬКО после зелёных тестов и только на push в
  # main (или явную пересборку от base-update.yml) — сломанный коммит
  # физически не доедет до ВДС (тот пуллит готовый образ, см.
  # scripts/auto-deploy.sh). Релизный тег пушится атомарно с веткой
  # (git push --atomic origin main vX.Y.Z), поэтому fetch-tags уже видит его
  # и git describe даёт чистый vX.Y.Z — как раньше при сборке на ВДС.
  # Дайджесты баз кладутся в label образа: base-update.yml сверяет их с
  # актуальными дайджестами на Docker Hub и триггерит пересборку при разнице.
  image:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_image == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
      golang: ${{ steps.bases.outputs.golang }}
      alpine: ${{ steps.bases.outputs.alpine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe нужна вся история и теги
          fetch-tags: true
      - id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - id: bases
        # Теги баз читаем из Dockerfile, а не хардкодим: dependabot меняет
        # только Dockerfile, и хардкод здесь ослеплял дозор после бампа 1.26→1.27.
        run: |
          bash scripts/base-digests.sh >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/menand/antispambot:build-${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          build-contexts: |
            ${{ steps.bases.outputs.golang_context }}
            ${{ steps.bases.outputs.alpine_context }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            base.digest.golang=${{ steps.bases.outputs.golang }}
            base.digest.alpine=${{ steps.bases.outputs.alpine }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rebuild_image == true))
    runs-on: ubuntu-latest
    concurrency:
      group: antispambot-production
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote checked digest
        env:
          REBUILD_IMAGE: ${{ inputs.rebuild_image }}
          CANDIDATE_DIGEST: ${{ needs.image.outputs.digest }}
          CANDIDATE_VERSION: ${{ needs.image.outputs.version }}
          CANDIDATE_GOLANG: ${{ needs.image.outputs.golang }}
          CANDIDATE_ALPINE: ${{ needs.image.outputs.alpine }}
        run: bash scripts/promote-image.sh
