name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Часовой дозор базовых образов (base-update.yml) дёргает пересборку прод-образа
  # без пуша кода, когда базовые образы из Dockerfile (golang:X.Y-alpine,
  # alpine:Z.W) обновились на Docker Hub.
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild production image from current main without a code push
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: gotag
        # Тулчейн тестов = тулчейн прод-образа: читаем версию прямо из
        # Dockerfile, чтобы dependabot-бамп базы не рассинхронизировал их
        # (хардкод '1.26' пережил бамп Dockerfile на 1.27 и тихо нарушил
        # этот инвариант).
        run: echo "go=$(awk '/^FROM golang/{tag=$2; gsub(/-alpine$/, "", tag); sub(/^golang:/, "", tag); print tag; exit}' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ steps.gotag.outputs.go }}'
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)" || { echo 'gofmt required:'; gofmt -l .; exit 1; }
      - run: go vet -tags stdjson ./...
      - run: go test -race -tags stdjson -count=1 ./...
      - run: go build -tags stdjson ./...

  # Прод-образ: собирается ТОЛЬКО после зелёных тестов и только на push в
  # main (или явную пересборку от base-update.yml) — сломанный коммит
  # физически не доедет до ВДС (тот пуллит готовый образ, см.
  # scripts/auto-deploy.sh). Релизный тег пушится атомарно с веткой
  # (git push --atomic origin main vX.Y.Z), поэтому fetch-tags уже видит его
  # и git describe даёт чистый vX.Y.Z — как раньше при сборке на ВДС.
  # Дайджесты баз кладутся в label образа: base-update.yml сверяет их с
  # актуальными дайджестами на Docker Hub и триггерит пересборку при разнице.
  image:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.rebuild_image == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe нужна вся история и теги
          fetch-tags: true
      - id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - id: bases
        # Теги баз читаем из Dockerfile, а не хардкодим: dependabot меняет
        # только Dockerfile, и хардкод здесь ослеплял дозор после бампа 1.26→1.27.
        run: |
          GOLANG=$(awk '/^FROM golang/{print $2; exit}' Dockerfile)
          ALPINE=$(awk '/^FROM alpine/{print $2; exit}' Dockerfile)
          echo "golang=$(docker buildx imagetools inspect "$GOLANG" | awk '/^Digest:/{print $2}')" >> "$GITHUB_OUTPUT"
          echo "alpine=$(docker buildx imagetools inspect "$ALPINE" | awk '/^Digest:/{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest — прод, :<describe> — точечный откат на любую сборку.
          tags: |
            ghcr.io/menand/antispambot:latest
            ghcr.io/menand/antispambot:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          labels: |
            base.digest.golang=${{ steps.bases.outputs.golang }}
            base.digest.alpine=${{ steps.bases.outputs.alpine }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
