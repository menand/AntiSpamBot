name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Держать в синхроне с golang:X.Y-alpine в Dockerfile — тестировать
          # тем же тулчейном, каким собирается прод-образ.
          go-version: '1.26'
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  # Прод-образ: собирается ТОЛЬКО после зелёных тестов и только на push в
  # main — сломанный коммит физически не доедет до ВДС (тот пуллит готовый
  # образ, см. scripts/auto-deploy.sh). Релизный тег пушится атомарно с веткой
  # (git push --atomic origin main vX.Y.Z), поэтому fetch-tags уже видит его
  # и git describe даёт чистый vX.Y.Z — как раньше при сборке на ВДС.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe нужна вся история и теги
          fetch-tags: true
      - id: ver
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest — прод, :<describe> — точечный откат на любую сборку.
          tags: |
            ghcr.io/menand/antispambot:latest
            ghcr.io/menand/antispambot:${{ steps.ver.outputs.version }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
