services:
  bot:
    # Прод-образ собирает CI (ci.yml, job image) — ВДС его только пуллит
    # (scripts/auto-deploy.sh). Секция build остаётся для локальной
    # разработки и аварийного fallback: make docker-up собирает на месте.
    image: ghcr.io/menand/antispambot:latest
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: menand-antispam
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/bot.db
      LOG_FILE: /data/bot.log
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
